name: Optimize Gallery Images

on:
  push:
    branches:
      - main
    paths:
      - "gallery/**"
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert gallery images to WebP
        shell: bash
        run: |
          shopt -s nullglob nocaseglob

          for file in gallery/*; do

            if [[ ! -f "$file" ]]; then
              continue
            fi

            case "$file" in
              *.jpg|*.jpeg|*.png)
                output="${file%.*}.webp"

                echo "Optimizing: $file"

                cwebp \
                  -q 82 \
                  -m 6 \
                  "$file" \
                  -o "$output"

                ;;

              *)
                ;;
            esac

          done

      - name: Commit generated WebP files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gallery/*.webp

          if git diff --cached --quiet; then
            echo "No new WebP files to commit."
            exit 0
          fi

          git commit -m "chore: optimize gallery images"
          git push
